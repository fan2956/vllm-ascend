name: Preserve Git AI attribution

# pull_request_target grants the base repository token required to write Git
# notes for merged pull requests, including pull requests from forks. The action
# does not execute pull request code.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  preserve:
    if: github.event.pull_request.merged == true
    runs-on: linux-amd64-cpu-2-hk
    steps:
      - name: Preserve merged attribution
        uses: git-ai-project/action/pr-close@v1
        with:
          github-token: ${{ github.token }}
          pr-url: ${{ github.event.pull_request.html_url }}
          merge-commit-sha: ${{ github.event.pull_request.merge_commit_sha }}
